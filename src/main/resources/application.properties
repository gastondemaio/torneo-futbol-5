# ==========================================================
#  Torneo Fútbol 5 - Configuración por defecto (H2 en archivo)
# ==========================================================
spring.application.name=futbol5-torneo
server.port=8080

# --- Base de datos H2 guardada en ./data/futbol5db.mv.db (persiste entre reinicios)
#     MODE=MySQL hace que H2 acepte la misma sintaxis que MySQL.
spring.datasource.url=jdbc:h2:file:./data/futbol5db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Consola web de H2: http://localhost:8080/h2-console  (JDBC URL: la de arriba, usuario sa, sin clave)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Las tablas las crea NUESTRO script schema.sql (no Hibernate)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- El frontend se sirve desde la carpeta ./frontend del proyecto
#     -> abrir http://localhost:8080 en el navegador
spring.web.resources.static-locations=file:./frontend/,classpath:/static/
# El navegador siempre pregunta si cambió el HTML/CSS/JS (evita ver una versión vieja de la página)
spring.web.resources.cache.cachecontrol.no-cache=true

# --- Reglas del torneo
torneo.zona-horaria=America/Argentina/Buenos_Aires
